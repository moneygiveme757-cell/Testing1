<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Map Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card p-4 shadow" style="width: 400px">
    <h3 class="text-center mb-3">🌦 Weather Map</h3>

    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="password" type="password" class="form-control mb-2" placeholder="Password">

    <div id="authError" class="text-danger small mb-2"></div>

    <button id="loginBtn" class="btn btn-primary w-100 mb-2">Login</button>
    <button id="signupBtn" class="btn btn-secondary w-100 mb-2">Sign Up</button>

    <hr>
    <button id="guestBtn" class="btn btn-outline-dark w-100">Continue as Guest</button>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
