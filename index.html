<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Map App</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="text-center mb-4">🌦 Weather Map App</h1>
  <div class="row justify-content-center mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <input
          type="text"
          id="cityInput"
          class="form-control"
          placeholder="Enter city name"
        />
        <button class="btn btn-primary" id="searchBtn">
          Search
        </button>
      </div>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-lg-10 text-center">
      <div class="map-wrapper shadow-sm position-relative">
        <div id="marker"></div>

        <img
          id="worldMap"
          src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
          class="img-fluid"
          alt="World Map"
        />
      </div>
      <p class="text-muted mt-2">
        Click anywhere on the map to view weather data
      </p>
    </div>
  </div>

</div>
<div class="modal fade" id="weatherModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">🌤 Weather Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="weatherContent"></div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
