<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Map</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-3">

  <div class="d-flex justify-content-between mb-3">
    <h4>🌍 Weather Map</h4>
    <div>
      <span id="userLabel" class="me-3"></span>
      <a href="history.html" class="btn btn-sm btn-outline-primary me-2">📜 History</a>
      <button id="logoutBtn" class="btn btn-sm btn-outline-danger">Exit</button>
    </div>
  </div>

  <div class="input-group mb-3">
    <input id="cityInput" class="form-control" placeholder="Enter city name">
    <button id="searchBtn" class="btn btn-primary">Search</button>
  </div>

  <div class="map-wrapper shadow">
    <div class="map-inner">
      <div id="marker"></div>
      <img id="worldMap" src="assets/world-map.png">
    </div>
  </div>
</div>

<div class="modal fade" id="weatherModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Weather Info</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="weatherContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
